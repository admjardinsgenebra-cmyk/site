# Cache por tipo de arquivo (este arquivo é incluído dentro do bloco http do NGINX)
map $uri $cache_control {
    ~*\.(?:jpg|jpeg|png|webp|svg|ico)$  "public, max-age=2592000";  # imagens: 30 dias
    ~*\.(?:css|js)$                     "public, max-age=3600";     # CSS/JS: 1 hora
    default                             "no-cache";                 # HTML: sempre revalida
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Compressão
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cabeçalhos (valem para todas as respostas)
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Bloqueia arquivos ocultos (.git, .env etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
